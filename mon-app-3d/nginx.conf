server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optionnel : pour servir les données correctement
    location /data/ {
        alias /usr/share/nginx/html/data/;
    }
}