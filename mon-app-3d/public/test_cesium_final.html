
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Visualisation du trafic SUMO - Cesium</title>

    <!-- Bibliothèque Cesium -->
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.88/Build/Cesium/Cesium.js"></script>

    <!-- Styles Cesium -->
    <link
        href="https://cesium.com/downloads/cesiumjs/releases/1.88/Build/Cesium/Widgets/widgets.css"
        rel="stylesheet"
    >

    <!-- Styles personnalisés -->
    <style>
        html,
        body,
        #cesiumContainer {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        /* Panneau d'information */
        #infoPanel {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;

            padding: 12px 20px;

            background: rgba(10, 15, 25, 0.88);
            color: white;

            border: 1px solid #3cd2ff;
            border-radius: 8px;

            font-family: Arial, sans-serif;
            font-size: 14px;
            line-height: 1.8;
        }
    </style>
</head>

<body>

    <!-- Conteneur de la carte 3D -->
    <div id="cesiumContainer"></div>

    <!-- =========================================
         SCRIPT PRINCIPAL
    ========================================== -->

    <script>

        // =========================================
        // 1. CONFIGURATION GENERALE
        // =========================================

        Cesium.Ion.defaultAccessToken = 'TON_TOKEN_ACTUEL';

        const CONFIG = {
            position: {
                longitude: -6.8416,
                latitude: 34.0209,
                altitude: 800
            },

            camera: {
                heading: 45,
                pitch: -40,
                roll: 0
            },

            dataFolder: 'data/'
        };


        // =========================================
        // 2. DEFINITION DES SCENARIOS
        // =========================================

        const SCENARIOS = {

            actuel: {
                name: 'Situation actuelle',
                showTrafficLegend: true
            },

            pic: {
                name: 'Pic de trafic +30 %',
                showTrafficLegend: false
            },

            rue_fermee: {
                name: 'Rue fermée',
                overlay: 'rue_fermee_troncons.geojson'
            },

            voie_reservee: {
                name: 'Voie réservée aux bus',
                overlay: 'axe_4330541.geojson',
                showTrafficLegend: true
            }

        };

        const scenario =
            new URLSearchParams(window.location.search).get('scenario') || 'actuel';

        const currentScenario = SCENARIOS[scenario] || {
            name: scenario
        };


        // =========================================
        // 3. INITIALISATION DE CESIUM
        // =========================================

        const viewer = new Cesium.Viewer('cesiumContainer', {

            terrainProvider: new Cesium.EllipsoidTerrainProvider(),

            timeline: true,
            animation: true,

            shouldAnimate: true

        });

        viewer.scene.globe.enableLighting = true;


        // =========================================
        // 4. GESTION DU PANNEAU D'INFORMATION
        // =========================================

        function createInfoPanel() {

            const panel = document.createElement('div');

            panel.id = 'infoPanel';

            panel.innerHTML = `
                <strong>Visualisation du trafic SUMO</strong>
                <br>
                Scénario : ${currentScenario.name}
                <div id="legend"></div>
                <div id="status"></div>
            `;

            document.body.appendChild(panel);

            return panel;

        }

        const infoPanel = createInfoPanel();


        // =========================================
        // 5. GENERATION DE LA LEGENDE
        // =========================================

        function createLegend() {

            const legend = document.getElementById('legend');

            let content = '';

            if (currentScenario.showTrafficLegend) {

                content += `
                    <span style="color:#ff9600">●</span> Bus
                    &nbsp;
                    <span style="color:#3cd2ff">●</span> Voitures
                    <br>
                `;

            }

            if (scenario === 'voie_reservee') {

                content += `
                    <span style="color:#28dc78">━</span> Voie réservée
                    &nbsp;
                    <span style="color:#ffd700">━</span> Axe
                `;

            }

            if (scenario === 'rue_fermee') {

                content += `
                    <span style="color:#ff2828">━</span> Avenue fermée
                    <br>
                    <span style="color:#ff5aaa">━</span> Transversales fermées
                `;

            }

            legend.innerHTML = content;

        }

        createLegend();


        // =========================================
        // 6. AFFICHAGE DES BATIMENTS 3D
        // =========================================

        function loadBuildings() {

            viewer.scene.primitives.add(
                Cesium.createOsmBuildings()
            );

        }

        loadBuildings();


        // =========================================
        // 7. GESTION DES STYLES GEOJSON
        // =========================================

        function styleGeoJsonEntities(dataSource) {

            dataSource.entities.values.forEach(entity => {

                if (!entity.polyline) return;

                const properties = entity.properties || {};

                const kind = properties.kind
                    ? properties.kind.getValue()
                    : null;

                const type = properties.type
                    ? properties.type.getValue()
                    : null;

                let color = Cesium.Color.RED;
                let width = 10;

                // Transversales fermées
                if (type === 'transversale') {

                    color = Cesium.Color.fromCssColorString('#ff5aaa');
                    width = 6;

                }

                // Axe principal
                if (kind === 'axe') {

                    color = Cesium.Color.GOLD.withAlpha(0.7);
                    width = 12;

                }

                // Voie réservée aux bus
                if (kind === 'voie_reservee') {

                    color = Cesium.Color.fromCssColorString('#28dc78');
                    width = 6;

                }

                entity.polyline.material = color;
                entity.polyline.width = width;
                entity.polyline.clampToGround = true;

            });

        }


        // =========================================
        // 8. CHARGEMENT DES COUCHES GEOJSON
        // =========================================

        async function loadOverlay() {

            if (!currentScenario.overlay) {
                return;
            }

            const file =
                CONFIG.dataFolder + currentScenario.overlay;

            try {

                const dataSource = await Cesium.GeoJsonDataSource.load(
                    file,
                    {
                        clampToGround: true
                    }
                );

                styleGeoJsonEntities(dataSource);

                viewer.dataSources.add(dataSource);

            } catch (error) {

                console.error('Erreur GeoJSON :', error);

                showStatus(
                    'Impossible de charger le fichier GeoJSON.',
                    '#ff6b6b'
                );

            }

        }


        // =========================================
        // 9. CHARGEMENT DES DONNEES DE TRAFIC CZML
        // =========================================

        async function loadTraffic() {

            const file =
                `${CONFIG.dataFolder}trafic_czml_${scenario}.json?v=${Date.now()}`;

            try {

                const dataSource = await Cesium.CzmlDataSource.load(file);

                viewer.dataSources.add(dataSource);

                viewer.clock.shouldAnimate = true;

                showStatus('Données de trafic chargées.', '#28dc78');

            } catch (error) {

                console.error('Erreur CZML :', error);

                showStatus(
                    `Fichier CZML introuvable pour "${scenario}". Vérifiez les données SUMO.`,
                    '#ff6b6b'
                );

            }

        }


        // =========================================
        // 10. POSITIONNEMENT DE LA CAMERA
        // =========================================

        function positionCamera() {

            viewer.camera.flyTo({

                destination: Cesium.Cartesian3.fromDegrees(
                    CONFIG.position.longitude,
                    CONFIG.position.latitude,
                    CONFIG.position.altitude
                ),

                orientation: {

                    heading: Cesium.Math.toRadians(
                        CONFIG.camera.heading
                    ),

                    pitch: Cesium.Math.toRadians(
                        CONFIG.camera.pitch
                    ),

                    roll: CONFIG.camera.roll

                },

                duration: 2

            });

        }


        // =========================================
        // 11. AFFICHAGE DES MESSAGES
        // =========================================

        function showStatus(message, color) {

            const status = document.getElementById('status');

            status.innerHTML = `
                <span style="color:${color}">
                    ${message}
                </span>
            `;

        }


        // =========================================
        // 12. EXECUTION PRINCIPALE
        // =========================================

        async function initializeApplication() {

            showStatus('Chargement des données...', '#3cd2ff');

            // Chargement des couches géographiques
            await loadOverlay();

            // Chargement de la simulation de trafic
            await loadTraffic();

            // Positionnement de la caméra
            positionCamera();

        }

        initializeApplication();

    </script>

</body>
</html>
