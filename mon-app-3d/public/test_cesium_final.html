<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Cesium + Trafic SUMO</title>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.88/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.88/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <style>
    html, body, #cesiumContainer { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <script>
    Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJub25jZSI6Imc4aFE5ak01YUd2MGV6VjkiLCJqdGkiOiJmMzQ4N2UwMC00NmVhLTRiNWMtYjdmMS1mZDQ4MGI4ODgxOTQiLCJpZCI6NTUyNzY2LCJpc3MiOiJodHRwczovL2FwaS5jZXNpdW0uY29tIiwiYXVkIjoidW5kZWZpbmVkX2RlZmF1bHQiLCJpYXQiOjE3OTUwOTA2Mjl9.PpdihuurVaTHJbAEbCTJNGP12d3Gy-iLxJzWBsN4Sz0';

    const viewer = new Cesium.Viewer('cesiumContainer', {
      terrainProvider: new Cesium.EllipsoidTerrainProvider(),
      timeline: true,
      animation: true
    });
    
    viewer.scene.globe.enableLighting = true;
    viewer.clock.currentTime = Cesium.JulianDate.fromIso8601('2024-06-21T12:00:00Z');

    const urlParams = new URLSearchParams(window.location.search);
    const scenario = urlParams.get('scenario') || 'actuel';

    let nomAffiche = "Situation Actuelle";
    if (scenario === 'pic') nomAffiche = 'Pic de trafic +30%';
    if (scenario === 'rue_fermee') nomAffiche = 'Rue Fermée';
    if (scenario === 'voie_reservee') nomAffiche = 'Voie Réservée';

    const infoPanel = document.createElement('div');
    infoPanel.style.position = 'absolute';
    infoPanel.style.top = '20px';
    infoPanel.style.left = '20px';
    infoPanel.style.background = 'rgba(10, 15, 25, 0.85)';
    infoPanel.style.color = 'white';
    infoPanel.style.padding = '10px 20px';
    infoPanel.style.borderRadius = '8px';
    infoPanel.style.zIndex = '1000';
    infoPanel.style.fontFamily = 'sans-serif';
    infoPanel.style.border = '1px solid #3cd2ff';
    infoPanel.innerHTML = `<b>Vue Cesium :</b> ${nomAffiche}`;
    document.body.appendChild(infoPanel);

    viewer.scene.primitives.add(Cesium.createOsmBuildings());

    const czmlFile = `data/trafic_czml_${scenario}.json`;
    Cesium.CzmlDataSource.load(czmlFile).then(function(dataSource) {
      viewer.dataSources.add(dataSource);
      viewer.camera.flyTo({
        destination: Cesium.Cartesian3.fromDegrees(-6.8416, 34.0209, 800),
        orientation: { heading: Cesium.Math.toRadians(45.0), pitch: Cesium.Math.toRadians(-40.0), roll: 0.0 }
      });
      viewer.clock.shouldAnimate = true;
    });
  </script>
</body>
</html>
