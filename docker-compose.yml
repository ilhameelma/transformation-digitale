services:
  m1:
    build:
      context: ./sim
      dockerfile: Dockerfile.m1
    volumes:
      - ./data:/data
  m2:
    build:
      context: ./sim
      dockerfile: Dockerfile.m2
    volumes:
      - ./data:/data
  viz:
    build:
      context: ./viz
      dockerfile: Dockerfile.viz
    ports:
      - "8501:8501"
    volumes:
      - ./data:/data

  # À ajouter dans docker-compose.yml, sous "services:" (même indentation que m1, m2, viz)
  traffic:
    build:
      context: ./traffic
      dockerfile: Dockerfile.traffic
    volumes:
      - ./data:/data