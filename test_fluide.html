<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Test Fluide - Jumeau Numérique</title>
  <script src="https://unpkg.com/deck.gl@latest/dist.min.js"></script>
  <script src="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    body { margin: 0; padding: 0; overflow: hidden; background: #0a0a0a; font-family: sans-serif; }
    #map { width: 100vw; height: 100vh; }
    
    #kpi-panel {
      position: absolute; top: 20px; left: 20px; z-index: 1000;
      background: rgba(15, 20, 30, 0.85); color: white;
      padding: 15px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(4px); box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      width: 250px;
    }
    .kpi-title { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
    .kpi-item { margin: 5px 0; font-size: 14px; display: flex; justify-content: space-between; }
    .kpi-value { font-weight: bold; color: #3cd2ff; font-size: 16px; }
    .kpi-label { color: #ccc; }
    
    .street-list { margin-top: 15px; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 10px; }
    .street-item { margin: 8px 0; font-size: 12px; line-height: 1.2; }
    .street-name { font-weight: bold; color: #fff; }
    .street-cong { color: #ff4b4b; font-size: 11px; }

    #drone-btn {
      position: absolute; top: 20px; right: 20px; z-index: 1000;
      background: #3cd2ff; color: #000; border: none; padding: 12px 20px;
      border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: all 0.3s;
    }
    #drone-btn:hover { background: #5ce0ff; transform: translateY(-2px); }
    #drone-btn.active { background: #ff4b4b; color: white; }

    #debug-box {
      position: absolute; bottom: 20px; left: 20px; z-index: 1000;
      background: rgba(0, 0, 0, 0.7); color: #0f0; padding: 10px;
      font-family: monospace; font-size: 11px; border-radius: 4px;
      max-height: 150px; overflow-y: auto; width: 300px;
      border: 1px solid #333;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  
  <div id="kpi-panel">
    <div class="kpi-title">Situation Actuelle (SUMO)</div>
    <div class="kpi-item"><span class="kpi-label">Temps trajet:</span> <span class="kpi-value" id="kpi-temps">--</span></div>
    <div class="kpi-item"><span class="kpi-label">Vitesse moy:</span> <span class="kpi-value" id="kpi-vitesse">--</span></div>
    <div class="kpi-item"><span class="kpi-label">Congestion:</span> <span class="kpi-value" id="kpi-congestion">--</span></div>
    <div class="kpi-item"><span class="kpi-label">CO₂ total:</span> <span class="kpi-value" id="kpi-co2">--</span></div>
    
    <div class="street-list" id="street-list">
      <div class="kpi-title" style="margin-bottom: 5px;">Axes Principaux</div>
    </div>
  </div>

  <button id="drone-btn">🎬 Lancer le vol cinématique</button>
  
  <div id="debug-box">
    <div style="color:#fff; margin-bottom:5px; font-weight:bold;">Console de débogage</div>
    <div id="debug-content">Chargement des données...</div>
  </div>

  <script>
    let isDroneMode = false;
    let cameraPath = [];
    let pathIndex = 0;
    let topStreetsData = [];
    const debugContent = document.getElementById('debug-content');
    
    function logDebug(msg, isError = false) {
      const p = document.createElement('div');
      p.style.color = isError ? '#ff4b4b' : '#0f0';
      p.innerText = msg;
      debugContent.appendChild(p);
    }

    Promise.all([
      fetch('data/buildings.geojson').then(r => r.json()).catch(() => ({type: "FeatureCollection", features: []})),
      fetch('data/trajectories_actuel.json').then(r => r.json()).catch(() => []),
      fetch('data/kpi_actuel.json').then(r => r.json()).catch(() => null),
      fetch('data/network_edges.geojson').then(r => r.json()).catch(() => null) 
    ]).then(([buildings, rawTrips, kpi, networkEdges]) => {
      
      if (!kpi) logDebug("ERREUR: kpi_actuel.json introuvable", true);
      if (!networkEdges) logDebug("ERREUR: network_edges.geojson introuvable", true);
      if (!buildings.features || buildings.features.length === 0) logDebug("ERREUR: Bâtiments introuvables", true);

      if (kpi) {
        document.getElementById('kpi-temps').innerText = kpi.temps_trajet_moyen_s.toFixed(0) + " s";
        document.getElementById('kpi-vitesse').innerText = kpi.vitesse_moyenne_kmh.toFixed(1) + " km/h";
        document.getElementById('kpi-congestion').innerText = (kpi.congestion_moyenne * 100).toFixed(0) + " %";
        document.getElementById('kpi-co2').innerText = (kpi.co2_total_g / 1000).toFixed(0) + " kg";
      }

      const trips = [];
      let tMax = 100;
      rawTrips.forEach((v, i) => {
        if (v.path && v.path.length > 1) {
          const pts = v.path.map(p => [p[0], p[1]]);
          const ts = v.timestamps || v.path.map(p => p[2]);
          trips.push({ path: pts, timestamps: ts, color: [60, 210, 255] });
          if (ts.length > 0) tMax = Math.max(tMax, ts[ts.length - 1]);
        }
      });
      logDebug(`Trajets chargés : ${trips.length}`);

      let center = [-6.8416, 34.0209];
      if (buildings.features.length > 0) {
        let minLon = 180, maxLon = -180, minLat = 90, maxLat = -90;
        buildings.features.forEach(f => {
          f.geometry.coordinates[0].forEach(p => {
            minLon = Math.min(minLon, p[0]); maxLon = Math.max(maxLon, p[0]);
            minLat = Math.min(minLat, p[1]); maxLat = Math.max(maxLat, p[1]);
          });
        });
        center = [(minLon + maxLon) / 2, (minLat + maxLat) / 2];
      }

      // --- CORRECTION DU BUG name.replace ---
      if (kpi && kpi.congestion_par_rue && networkEdges) {
        const streetRates = kpi.congestion_par_rue;
        const edgeInfo = {};
        
        networkEdges.features.forEach(f => {
          const rawId = f.properties.osmid || f.properties.id;
          if (!rawId) return;

          const idMatches = String(rawId).match(/\d+/g); 
          
          if (idMatches && f.geometry && (f.geometry.type === "LineString" || f.geometry.type === "MultiLineString")) {
            let coords = f.geometry.type === "LineString" ? f.geometry.coordinates : f.geometry.coordinates[0];
            if (coords && coords.length > 0) {
               const midPoint = coords[Math.floor(coords.length / 2)];
               
               // 1. On récupère le nom brut
               let rawName = f.properties.name;
               
               // 2. On le force en chaîne de caractères (si c'est un tableau, ça devient "a,b")
               let nameStr = String(rawName || "Rue sans nom");
               
               // 3. On nettoie (arabe, crochets, guillemets)
               let name = nameStr.replace(/[\u0600-\u06FF]/g, '').replace(/["'\[\]]/g, '').trim();
               
               // 4. Si c'est vide après nettoyage
               if (name === "" || name === "null") name = "Rue sans nom";

               idMatches.forEach(id => {
                 edgeInfo[id] = { name: name, position: [midPoint[0], midPoint[1], 20] };
               });
            }
          }
        });

        const sortedStreets = Object.entries(streetRates)
          .sort((a, b) => b[1] - a[1])
          .slice(0, 3);

        let matchCount = 0;
        sortedStreets.forEach(([edgeId, rate]) => {
          if (edgeInfo[edgeId]) {
            matchCount++;
            topStreetsData.push({
              name: edgeInfo[edgeId].name,
              position: edgeInfo[edgeId].position,
              rate: rate,
              label: rate > 0.75 ? "Sévère" : rate > 0.5 ? "Élevée" : "Modérée"
            });
          } else {
            logDebug(`Pas de match pour l'ID: ${edgeId}`, true);
          }
        });
        
        logDebug(`Rues trouvées : ${matchCount} / ${sortedStreets.length}`);
      } else {
        logDebug("Données de congestion ou GeoJSON manquants", true);
      }

      const listContainer = document.getElementById('street-list');
      if (topStreetsData.length > 0) {
        topStreetsData.forEach((st, i) => {
          const div = document.createElement('div');
          div.className = 'street-item';
          div.innerHTML = `<span class="street-name">${i+1}. ${st.name}</span><br>
                           <span class="street-cong">${st.label} (${(st.rate*100).toFixed(0)}%)</span>`;
          listContainer.appendChild(div);
        });
      } else {
        listContainer.innerHTML += '<div class="street-item" style="color:#ff4b4b">Aucune rue trouvée</div>';
      }

      cameraPath = [
        { longitude: center[0] + 0.002, latitude: center[1] - 0.002, zoom: 17.5, pitch: 45, bearing: 0, duration: 4000 },
        { longitude: center[0] + 0.001, latitude: center[1] - 0.001, zoom: 16.5, pitch: 55, bearing: 30, duration: 3000 },
        { longitude: center[0], latitude: center[1], zoom: 15.5, pitch: 60, bearing: 15, duration: 3000 },
        { longitude: center[0], latitude: center[1], zoom: 14.5, pitch: 50, bearing: -20, duration: 4000 }
      ];

      const initialView = { 
        longitude: cameraPath[0].longitude, latitude: cameraPath[0].latitude, 
        zoom: cameraPath[0].zoom, pitch: cameraPath[0].pitch, bearing: cameraPath[0].bearing 
      };

      const deckgl = new deck.DeckGL({
        container: 'map',
        mapStyle: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
        initialViewState: initialView,
        controller: true,
        layers: []
      });

      const btn = document.getElementById('drone-btn');
      btn.addEventListener('click', () => {
        isDroneMode = !isDroneMode;
        if (isDroneMode) {
          btn.innerText = "⏹ Arrêter";
          btn.classList.add('active');
          pathIndex = 0;
          playCameraPath();
        } else {
          btn.innerText = "🎬 Lancer le vol";
          btn.classList.remove('active');
          deckgl.setProps({ initialViewState: initialView });
        }
      });

      function playCameraPath() {
        if (!isDroneMode || pathIndex >= cameraPath.length) {
          if (pathIndex >= cameraPath.length) {
            isDroneMode = false;
            btn.innerText = "🎬 Rejouer le vol";
            btn.classList.remove('active');
          }
          return;
        }
        const step = cameraPath[pathIndex];
        deckgl.setProps({
          initialViewState: {
            longitude: step.longitude, latitude: step.latitude,
            zoom: step.zoom, pitch: step.pitch, bearing: step.bearing,
            transitionDuration: step.duration
          }
        });
        setTimeout(() => { pathIndex++; playCameraPath(); }, step.duration + 500);
      }

      let t = 0;
      let trailLength = 150;
      
      function animate() {
        t = (t + 1) % tMax;
        const layers = [];
        
        if (buildings.features.length > 0) {
          layers.push(new deck.GeoJsonLayer({
            id: 'buildings', data: buildings, extruded: true,
            getElevation: f => f.properties.height || 10,
            getFillColor: [50, 55, 70], pickable: false,
            material: { ambient: 0.5, diffuse: 0.8 }
          }));
        }

        layers.push(new deck.TripsLayer({
          id: 'trips', data: trips, getPath: d => d.path,
          getTimestamps: d => d.timestamps, getColor: d => d.color,
          widthMinPixels: 4, rounded: true, trailLength: trailLength, currentTime: t
        }));

        if (topStreetsData.length > 0) {
          layers.push(new deck.TextLayer({
            id: 'street-labels',
            data: topStreetsData,
            getPosition: d => d.position,
            getText: d => `${d.name}\n${d.label}`,
            getSize: 11,
            getColor: [255, 255, 255, 255],
            getBackgroundColor: [20, 20, 25, 200],
            backgroundPadding: [4, 2],
            getTextAnchor: 'middle',
            getAlignmentBaseline: 'bottom',
            getPixelOffset: [0, -15],
            billboard: true,
            fontFamily: 'Arial, sans-serif'
          }));
        }

        deckgl.setProps({ layers: layers });
        requestAnimationFrame(animate);
      }

      animate();
    }).catch(err => {
        logDebug("Erreur fatale : " + err.message, true);
    });
  </script>
</body>
</html>
