<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Jumeau Numérique 3D - Rabat</title>
  <script src="https://unpkg.com/deck.gl@latest/dist.min.js"></script>
  <script src="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    body { margin: 0; padding: 0; overflow: hidden; background: #0a0a0a; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    #map { width: 100vw; height: 100vh; }
    
    /* Panneau KPI propre */
    #kpi-panel {
      position: absolute; top: 20px; left: 20px; z-index: 1000;
      background: rgba(10, 15, 25, 0.85); color: white;
      padding: 18px; border-radius: 8px; border: 1px solid rgba(60, 210, 255, 0.3);
      backdrop-filter: blur(8px); box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      width: 260px;
    }
    .kpi-title { font-size: 11px; color: #3cd2ff; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 12px; font-weight: bold;}
    .kpi-row { margin: 8px 0; font-size: 13px; display: flex; justify-content: space-between; align-items: center;}
    .kpi-value { font-weight: bold; color: #fff; font-size: 15px; }
    .kpi-label { color: #8a9bb0; }
    
    /* Top 5 panneau */
    .street-list { margin-top: 15px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 12px; }
    .street-item { margin: 6px 0; font-size: 12px; line-height: 1.3; }
    .street-name { font-weight: 600; color: #fff; }
    .street-cong { color: #ff4b4b; font-size: 11px; }

    /* Bouton Drone */
    #drone-btn {
      position: absolute; bottom: 30px; right: 30px; z-index: 1000;
      background: #3cd2ff; color: #000; border: none; padding: 14px 24px;
      border-radius: 30px; font-weight: bold; cursor: pointer; font-size: 14px;
      box-shadow: 0 4px 15px rgba(60, 210, 255, 0.4); transition: all 0.3s;
    }
    #drone-btn:hover { background: #5ce0ff; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(60, 210, 255, 0.6); }
    #drone-btn.active { background: #ff4b4b; color: white; box-shadow: 0 4px 15px rgba(255, 75, 75, 0.4); }
  </style>
</head>
<body>
  <div id="map"></div>
  
  <div id="kpi-panel">
    <div class="kpi-title">Situation Actuelle</div>
    <div class="kpi-row"><span class="kpi-label">Temps trajet</span> <span class="kpi-value" id="kpi-temps">--</span></div>
    <div class="kpi-row"><span class="kpi-label">Vitesse moy.</span> <span class="kpi-value" id="kpi-vitesse">--</span></div>
    <div class="kpi-row"><span class="kpi-label">Congestion</span> <span class="kpi-value" id="kpi-congestion">--</span></div>
    <div class="kpi-row"><span class="kpi-label">CO₂ total</span> <span class="kpi-value" id="kpi-co2">--</span></div>
    
    <div class="street-list" id="street-list">
      <div class="kpi-title" style="margin-bottom: 8px; font-size: 10px;">Axes Principaux</div>
    </div>
  </div>

  <button id="drone-btn">🎬 Lancer le vol</button>

  <script>
    let isDroneMode = false;
    let cameraPath = [];
    let pathIndex = 0;
    let topStreetsData = [];
    
    Promise.all([
      fetch('../data/buildings.geojson').then(r => r.json()).catch(() => ({type: "FeatureCollection", features: []})),
      fetch('../data/trajectories_actuel.json').then(r => r.json()).catch(() => []),
      fetch('../data/kpi_actuel.json').then(r => r.json()).catch(() => null),
      fetch('../data/network_edges.geojson').then(r => r.json()).catch(() => null) 
    ]).then(([buildings, rawTrips, kpi, networkEdges]) => {
      
      // 1. KPI
      if (kpi) {
        document.getElementById('kpi-temps').innerText = kpi.temps_trajet_moyen_s.toFixed(0) + " s";
        document.getElementById('kpi-vitesse').innerText = kpi.vitesse_moyenne_kmh.toFixed(1) + " km/h";
        document.getElementById('kpi-congestion').innerText = (kpi.congestion_moyenne * 100).toFixed(0) + " %";
        document.getElementById('kpi-co2').innerText = (kpi.co2_total_g / 1000).toFixed(0) + " kg";
      }

      // 2. Trajets
      const trips = [];
      let tMax = 100;
      rawTrips.forEach((v) => {
        if (v.path && v.path.length > 1) {
          const pts = v.path.map(p => [p[0], p[1]]);
          const ts = v.timestamps || v.path.map(p => p[2]);
          trips.push({ path: pts, timestamps: ts, color: [60, 210, 255] });
          if (ts.length > 0) tMax = Math.max(tMax, ts[ts.length - 1]);
        }
      });

      // 3. Centre
      let center = [-6.8416, 34.0209];
      if (buildings.features.length > 0) {
        let minLon = 180, maxLon = -180, minLat = 90, maxLat = -90;
        buildings.features.forEach(f => {
          f.geometry.coordinates[0].forEach(p => {
            minLon = Math.min(minLon, p[0]); maxLon = Math.max(maxLon, p[0]);
            minLat = Math.min(minLat, p[1]); maxLat = Math.max(maxLat, p[1]);
          });
        });
        center = [(minLon + maxLon) / 2, (minLat + maxLat) / 2];
      }

      // 4. Rues (Top 5 max, espacées)
      if (kpi && kpi.congestion_par_rue && networkEdges) {
        const streetRates = kpi.congestion_par_rue;
        const edgeInfo = {};
        
        networkEdges.features.forEach(f => {
          const rawId = f.properties.osmid || f.properties.id;
          if (!rawId) return;
          const idMatches = String(rawId).match(/\d+/g); 
          if (idMatches && f.geometry && f.geometry.type === "LineString") {
            let coords = f.geometry.coordinates;
            const midPoint = coords[Math.floor(coords.length / 2)];
            let name = String(f.properties.name || "Rue sans nom").replace(/[\u0600-\u06FF]/g, '').replace(/["'\[\]]/g, '').trim();
            if (name === "") name = "Rue sans nom";
            idMatches.forEach(id => {
              edgeInfo[id] = { name: name, position: [midPoint[0], midPoint[1], 20] };
            });
          }
        });

        // Trier et filtrer pour éviter les superpositions
        const sortedStreets = Object.entries(streetRates).sort((a, b) => b[1] - a[1]);
        let addedCount = 0;
        
        for (const [edgeId, rate] of sortedStreets) {
          if (addedCount >= 5) break; // Max 5 étiquettes
          if (edgeInfo[edgeId]) {
            // Vérifier si une étiquette est déjà trop proche
            const pos = edgeInfo[edgeId].position;
            let tooClose = false;
            for (const existing of topStreetsData) {
              const dist = Math.sqrt(Math.pow(pos[0] - existing.position[0], 2) + Math.pow(pos[1] - existing.position[1], 2));
              if (dist < 0.003) { tooClose = true; break; } // ~300m
            }
            
            if (!tooClose) {
              topStreetsData.push({
                name: edgeInfo[edgeId].name,
                position: pos,
                rate: rate,
                label: rate > 0.75 ? "Sévère" : rate > 0.5 ? "Élevée" : "Modérée"
              });
              addedCount++;
            }
          }
        }
      }

      // Affichage panneau
      const listContainer = document.getElementById('street-list');
      topStreetsData.forEach((st, i) => {
        const div = document.createElement('div');
        div.className = 'street-item';
        div.innerHTML = `<span class="street-name">${i+1}. ${st.name}</span><br><span class="street-cong">${st.label}</span>`;
        listContainer.appendChild(div);
      });

      // 5. Caméra
      cameraPath = [
        { longitude: center[0] + 0.002, latitude: center[1] - 0.002, zoom: 17.5, pitch: 50, bearing: 0, duration: 4000 },
        { longitude: center[0] + 0.001, latitude: center[1] - 0.001, zoom: 16.5, pitch: 60, bearing: 30, duration: 3000 },
        { longitude: center[0], latitude: center[1], zoom: 15.5, pitch: 65, bearing: 15, duration: 3000 },
        { longitude: center[0], latitude: center[1], zoom: 14.5, pitch: 55, bearing: -20, duration: 4000 }
      ];

      const initialView = { 
        longitude: cameraPath[0].longitude, latitude: cameraPath[0].latitude, 
        zoom: cameraPath[0].zoom, pitch: cameraPath[0].pitch, bearing: cameraPath[0].bearing 
      };

      const deckgl = new deck.DeckGL({
        container: 'map',
        mapStyle: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
        initialViewState: initialView,
        controller: true,
        layers: []
      });

      const btn = document.getElementById('drone-btn');
      btn.addEventListener('click', () => {
        isDroneMode = !isDroneMode;
        if (isDroneMode) {
          btn.innerText = "⏹ Arrêter";
          btn.classList.add('active');
          pathIndex = 0;
          playCameraPath();
        } else {
          btn.innerText = "🎬 Lancer le vol";
          btn.classList.remove('active');
          deckgl.setProps({ initialViewState: initialView });
        }
      });

      function playCameraPath() {
        if (!isDroneMode || pathIndex >= cameraPath.length) {
          if (pathIndex >= cameraPath.length) {
            isDroneMode = false;
            btn.innerText = "🎬 Rejouer le vol";
            btn.classList.remove('active');
          }
          return;
        }
        const step = cameraPath[pathIndex];
        deckgl.setProps({
          initialViewState: {
            longitude: step.longitude, latitude: step.latitude,
            zoom: step.zoom, pitch: step.pitch, bearing: step.bearing,
            transitionDuration: step.duration
          }
        });
        setTimeout(() => { pathIndex++; playCameraPath(); }, step.duration + 500);
      }

      let t = 0;
      let trailLength = 150;
      
      function animate() {
        t = (t + 1) % tMax;
        const layers = [];
        
        // Bâtiments
        if (buildings.features.length > 0) {
          layers.push(new deck.GeoJsonLayer({
            id: 'buildings', data: buildings, extruded: true,
            getElevation: f => f.properties.height || 10,
            getFillColor: [40, 45, 55], pickable: false, // Gris foncé
            material: { ambient: 0.3, diffuse: 0.7, shininess: 50 }
          }));
        }

        // Trafic
        layers.push(new deck.TripsLayer({
          id: 'trips', data: trips, getPath: d => d.path,
          getTimestamps: d => d.timestamps, getColor: d => d.color,
          widthMinPixels: 4, rounded: true, trailLength: trailLength, currentTime: t
        }));

        // Étiquettes
        if (topStreetsData.length > 0) {
          layers.push(new deck.TextLayer({
            id: 'street-labels',
            data: topStreetsData,
            getPosition: d => d.position,
            getText: d => `${d.name}\n${d.label}`,
            getSize: 11,
            getColor: [255, 255, 255, 255],
            getBackgroundColor: [20, 25, 35, 220],
            backgroundPadding: [4, 2],
            getTextAnchor: 'middle',
            getAlignmentBaseline: 'bottom',
            getPixelOffset: [0, -15],
            billboard: true
          }));
        }

        deckgl.setProps({ layers: layers });
        requestAnimationFrame(animate);
      }

      animate();
    });
  </script>
</body>
</html>
